# SonarCloud project for ima-jin/market — see .github/workflows/sonarcloud.yml.
sonar.organization=ima-jin
sonar.projectKey=ima-jin_market

# relative paths to source directories — a Next.js fork typically narrows this to
# `src`; the bare template has no src/ yet, so scan the repo root.
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/build/**,**/coverage/**,**/migrations/**

# Populated by the Test job when a fork has one; harmless (0% new-code coverage
# reported, not a scan failure) when the report doesn't exist yet.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Coverage is not required for: build/config files (not app logic), React UI
# shells (layout/page/providers/auth-status — presentational, no business
# logic), drizzle schema/db wiring (exercised against a real Postgres
# instance, not unit-testable without one), the @ima-jin/auth-client route
# wrappers that are pure one-line delegations to the published SDK (testing
# them tests the SDK, not this app), and the test files themselves (a test
# isn't "covered" by another test — vitest's own coverage.exclude already
# omits them from lcov.info, so without this they'd be measured as 0% covered
# rather than skipped). `instrumentation.ts` (private-key guard + DID guard,
# see #7) and `src/lib/signing-identity.ts`/`src/lib/base-path.ts` now carry
# real branch logic and ARE unit tested — not excluded here.
sonar.coverage.exclusions=**/*.config.js,**/*.config.mjs,**/*.config.ts,**/__tests__/**,**/*.test.ts,app/layout.tsx,app/page.tsx,app/providers.tsx,app/globals.css,src/components/**,src/db/**,app/api/auth/**
